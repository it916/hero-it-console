# ─── Configuración de wrangler para el Hero IT Worker ───
# Este archivo le dice a wrangler cómo desplegar el worker.
# NO contiene secrets (las API keys siguen guardadas en Cloudflare).

# Nombre del worker en Cloudflare. Debe coincidir con el que ya existe
# en tu dashboard, si no, wrangler creará uno nuevo en vez de actualizar el actual.
name = "hero-email-worker"

# Archivo principal del worker — el código que se sube a Cloudflare.
main = "hero-email-worker.js"

# Fecha que fija la "versión" del runtime de Workers (qué APIs están disponibles).
# Cloudflare recomienda usar una fecha reciente; no hace falta cambiarla seguido.
compatibility_date = "2025-01-01"

# ── Bindings ──
# Los "bindings" conectan el worker a recursos de Cloudflare (KV, R2, D1, etc.).
# Aquí usas: KV para JSON pequeño (tickets, solicitudes, licencias) + R2 para
# archivos grandes (adjuntos de tickets — capturas, PDFs).
[[kv_namespaces]]
binding = "HERO_KV"
id = "1da921302dbd4923a67c7823e449ae34"

# R2 bucket para adjuntos de tickets de soporte. Keys de dos formas:
#   pending/{uuid}-{filename}       → archivo subido pero ticket no creado aún
#   tickets/{ticketId}/{filename}   → archivo asociado a un ticket real
# El renombrado pending→tickets ocurre en el handler POST /ticket cuando el
# ticket se crea con éxito. Los que quedan en pending/* son huérfanos.
[[r2_buckets]]
binding = "HERO_TICKETS_R2"
bucket_name = "hero-tickets-attachments"

# ── Variables públicas ──
# No son secrets — el FIREBASE_PROJECT_ID viaja en cada token Firebase como
# `aud` y se ve en el frontend del Hub. Lo usamos para validar Firebase ID
# tokens en /finanzas/send-report (módulo Finanzas del Hero Hub).
[vars]
FIREBASE_PROJECT_ID = "hero-hub-de520"

# ── Cron triggers ──
# Diario a las 13:00 UTC (9am EDT / 8am EST). Dispara el handler `scheduled`
# del worker, que revisa licencias por vencer (30/7/1/0 días) y manda un
# correo recordatorio a IT. Marca cada combinación (lic + período) como
# avisada en KV para no repetir en el mismo ciclo.
[triggers]
crons = ["0 13 * * *"]
